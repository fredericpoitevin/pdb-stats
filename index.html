<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDB Statistics</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #24292f;
            background: #f6f8fa;
        }

        main {
            max-width: 40rem;
            margin: 2rem;
            padding: 2rem;
            text-align: center;
            background: #fff;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
        }

        p {
            margin: 0 0 1.5rem;
            color: #57606a;
            font-size: 1.125rem;
        }

        a {
            display: inline-block;
            padding: 0.75rem 1rem;
            color: #fff;
            background: #0969da;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover,
        a:focus {
            background: #0550ae;
        }
    </style>
</head>
<body>
    <main>
        <h1>PDB Statistics Dashboard</h1>
        <p>Interactive charts and data table for PDB statistics.</p>
        <a href="pdb_dashboard.html">Open Dashboard</a>
    </main>
</body>
</html>
