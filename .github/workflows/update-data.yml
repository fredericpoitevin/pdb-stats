name: Update PDB data

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pdb-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh PDB data
        run: python fetch_pdb_stats.py

      - name: Verify YTD and year-end projections
        run: python -m pytest tests/test_ytd_projections.py -v

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            "PDB Annual per method - Sheet1.csv" \
            depositions_by_temperature.csv \
            depositions_by_neutron.csv \
            depositions_by_nmr.csv \
            pdb_dashboard.html

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "update pdb data"
          git push
